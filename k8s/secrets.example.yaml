# EXEMPLE UNIQUEMENT — NE PAS APPLIQUER TEL QUEL, NE PAS Y METTRE DE VRAIS SECRETS.
#
# Le vrai Secret n'est jamais versionné : il se crée directement dans le cluster
# via `kubectl create secret generic` (voir K8S_GUIDE.md). Ce fichier ne sert
# qu'à documenter la forme attendue (clés), dans le même esprit que .env.example.
#
# Les clés sont nommées exactement comme les variables d'environnement attendues
# par le backend (database.py / security.py), ce qui permet un `envFrom` direct.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory-app
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "replace-with-a-strong-db-password"
  JWT_SECRET_KEY: "replace-with-output-of-openssl-rand-hex-32"
